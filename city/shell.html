<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent-rgb: 125 240 255;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    .frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    .spot-overlay {
      position: fixed;
      inset: 0;
      z-index: 0.5;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x, 50%) var(--spot-y, 45%),
          rgb(var(--accent-rgb) / 0.18),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    body.spot-on .spot-overlay {
      opacity: 1;
    }

    .chrome {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      pointer-events: none;
    }
    .chrome > * { pointer-events: auto; }

    .chrome .controls {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      padding: 0.3rem 0.4rem;
      border: 1px solid rgb(var(--accent-rgb) / 0.25);
      border-radius: 12px;
      background: rgb(6 12 18 / 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 0 20px rgb(var(--accent-rgb) / 0.06),
        inset 0 1px 0 rgb(255 255 255 / 0.04);
    }
    .chrome .controls a,
    .chrome .controls button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgb(255 255 255 / 0.03);
      font-size: 1.25rem;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      font-family: inherit;
    }
    .chrome .controls a {
      color: var(--text-muted);
    }
    .chrome .controls button {
      color: var(--text-muted);
    }
    .chrome .controls a:hover,
    .chrome .controls button:hover {
      background: rgb(var(--accent-rgb) / 0.08);
      border-color: rgb(var(--accent-rgb) / 0.4);
      box-shadow: 0 0 12px rgb(var(--accent-rgb) / 0.15);
    }
    .chrome .controls a:focus-visible,
    .chrome .controls button:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.5);
      outline-offset: 2px;
    }
    .chrome .controls button.spot-on,
    .chrome .controls button.music-on {
      background: rgb(var(--accent-rgb) / 0.12);
      border-color: rgb(var(--accent-rgb) / 0.45);
      box-shadow: 0 0 14px rgb(var(--accent-rgb) / 0.2);
    }

    .chrome .links {
      max-width: 34rem;
      border: 1px solid rgb(var(--accent-rgb) / 0.2);
      border-radius: 12px;
      background: rgb(6 12 18 / 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0.4rem 0.6rem;
      box-shadow:
        0 0 20px rgb(var(--accent-rgb) / 0.05),
        inset 0 1px 0 rgb(255 255 255 / 0.04);
    }
    .chrome .links summary {
      cursor: pointer;
      color: var(--text);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .chrome .links summary::before {
      content: "🗺️";
      font-size: 1.1rem;
    }
    .chrome .links p {
      margin: 0.3rem 0 0.45rem;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .chrome .links ul {
      list-style: none;
      padding: 0;
      margin: 0.45rem 0 0;
      display: grid;
      gap: 0.35rem;
    }
    .chrome .links a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .chrome .links a:hover {
      color: rgb(var(--accent-rgb));
      border-bottom-color: rgb(var(--accent-rgb) / 0.55);
    }
    .chrome .links a:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 2px;
      border-bottom-color: transparent;
    }

  </style>
</head>
<body>
  <div class="chrome" role="region" aria-label="City navigation">
    <div class="controls" role="group" aria-label="City controls">
      <button type="button" id="spot-toggle" aria-pressed="false" aria-label="Toggle flashlight" title="Flashlight">🔦</button>
      <button type="button" id="music-toggle" aria-pressed="false" aria-label="Toggle music" title="Music — Neon Drift">🎵</button>
      <a href="../index.html" target="_top" aria-label="Exit" title="Exit">⬅️</a>
    </div>
    <details class="links" id="shell-links">
      <summary aria-label="Doors / Scene links">Doors</summary>
      <p id="shell-links-desc">Doors and signs in this scene.</p>
      <ul id="shell-links-list"></ul>
    </details>
  </div>
  <iframe class="frame" id="city-frame" src="index.html" title="City"></iframe>
  <div class="spot-overlay" id="spot-overlay" aria-hidden="true"></div>

  <script src="audio.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = 'dark';

      var frame = document.getElementById('city-frame');
      if (!frame) return;

      function setScene(path) {
        if (!path) return;
        if (/^(https?:|data:|blob:|javascript:)/i.test(path)) return;
        if (path.indexOf('..') !== -1) return;
        if (path.indexOf('/') !== -1) return;
        if (!/\.html($|\?)/i.test(path)) return;
        frame.src = path;
      }

      var params = new URLSearchParams(window.location.search);
      var requested = params.get('scene') || params.get('s') || '';
      if (requested) setScene(requested);
      if (window.location.hash && window.location.hash.length > 1) {
        setScene(window.location.hash.slice(1));
      }

      var FALLBACK_LINKS = {
        'index.html': [{ href: 'hub.html', text: 'Entry' }],
        'hub.html': [
          { href: 'arcade-room.html', text: 'Arcade' },
          { href: 'library-room.html', text: 'Library' },
          { href: 'daemon.html', text: 'Daemon (System)' },
          { href: 'https://expectfun.github.io/defi-visualized/', text: 'Rooftop → DeFi Visualized', external: true },
          { href: 'street.html', text: 'Forward → Street' },
          { href: 'https://expectfun.github.io/vibetools/', text: 'Workshop → vibe tools', external: true }
        ],
        'street.html': [
          { href: 'daemon.html', text: 'Daemon (System)' },
          { href: 'hub.html', text: 'Hub' },
          { href: 'station.html', text: 'Station' }
        ],
        'station.html': [{ href: 'street.html', text: 'Back to Street' }],
        'arcade-room.html': [
          { href: 'arcade.html', text: 'Arcade machine' },
          { href: 'hub.html', text: 'Back to Hub' }
        ],
        'library-room.html': [
          { href: 'library.html', text: 'Terminal' },
          { href: 'hub.html', text: 'Back to Hub' }
        ],
        'arcade.html': [
          { href: 'arcade-room.html', text: 'Back' },
          { href: 'https://expectfun.github.io/brunogames/brumba.html', text: 'Open full', external: true }
        ],
        'library.html': [
          { href: 'library-room.html', text: 'Back' },
          { href: 'hub.html', text: 'Exit to Hub' },
          { href: '../posts/jagged-intelligence.html', text: 'Open original' }
        ],
        'daemon.html': [
          { href: 'street.html', text: 'Back to Street' },
          { href: 'index.html', text: 'Entry' },
          { href: 'hub.html', text: 'Hub' },
          { href: '../index.html', text: 'Exit' }
        ]
      };

      function getFrameFilename() {
        try {
          var src = frame.src || '';
          var path = src.split('?')[0] || '';
          var name = path.split('/').pop() || '';
          return name || 'index.html';
        } catch (e) { return 'index.html'; }
      }

      function addLinkToList(list, item) {
        var li = document.createElement('li');
        var newA = document.createElement('a');
        var href = item.href || '';
        newA.textContent = item.text || href;
        newA.setAttribute('href', href);
        if (item.external || /^https?:/i.test(href)) {
          newA.setAttribute('target', '_blank');
          newA.setAttribute('rel', 'noopener');
        } else {
          newA.addEventListener('click', function (e) {
            var targetHref = this.getAttribute('href');
            if (targetHref && !/^https?:/i.test(targetHref)) {
              e.preventDefault();
              setScene(targetHref);
            }
          });
        }
        li.appendChild(newA);
        list.appendChild(li);
      }

      function syncLinksFromFrame() {
        var list = document.getElementById('shell-links-list');
        var desc = document.getElementById('shell-links-desc');
        if (!list) return;
        list.innerHTML = '';
        var hasLinks = false;
        try {
          var doc = frame.contentDocument;
          if (doc) {
            var sceneLinks = doc.querySelector('.links');
            if (sceneLinks) {
              var summaryEl = sceneLinks.querySelector('summary');
              var pEl = sceneLinks.querySelector('p');
              var ul = sceneLinks.querySelector('ul');
              if (summaryEl) {
                var shellSummary = document.querySelector('#shell-links summary');
                if (shellSummary) shellSummary.textContent = summaryEl.textContent;
              }
              if (pEl && desc) desc.textContent = pEl.textContent;
              if (ul) {
                var links = ul.querySelectorAll('a');
                for (var i = 0; i < links.length; i++) {
                  var a = links[i];
                  var li = document.createElement('li');
                  var newA = document.createElement('a');
                  var href = a.getAttribute('href') || '';
                  newA.textContent = a.textContent.trim();
                  newA.setAttribute('href', href);
                  if (/^https?:/i.test(href)) {
                    newA.setAttribute('target', '_blank');
                    newA.setAttribute('rel', 'noopener');
                  } else {
                    newA.addEventListener('click', function (e) {
                      var targetHref = this.getAttribute('href');
                      if (targetHref && !/^https?:/i.test(targetHref)) {
                        e.preventDefault();
                        setScene(targetHref);
                      }
                    });
                  }
                  li.appendChild(newA);
                  list.appendChild(li);
                  hasLinks = true;
                }
              }
            }
          }
        } catch (err) {}
        if (!hasLinks && list.children.length === 0) {
          var filename = getFrameFilename();
          var items = FALLBACK_LINKS[filename];
          if (items) {
            for (var j = 0; j < items.length; j++) addLinkToList(list, items[j]);
          }
        }
      }

      frame.addEventListener('load', syncLinksFromFrame);
      if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
        syncLinksFromFrame();
      }

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var spotKey = 'city-flashlight';
      var spotToggle = document.getElementById('spot-toggle');
      var spotOverlay = document.getElementById('spot-overlay');
      var raf = 0;
      var lastX = window.innerWidth / 2;
      var lastY = window.innerHeight / 2;

      function isSpotOn() {
        try { return localStorage.getItem(spotKey) !== 'off'; } catch (e) { return true; }
      }
      function setSpotOn(on) {
        try { localStorage.setItem(spotKey, on ? 'on' : 'off'); } catch (e) {}
        document.body.classList.toggle('spot-on', on);
        if (spotToggle) {
          spotToggle.classList.toggle('spot-on', on);
          spotToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        if (on) {
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          if (!reduceMotion) document.addEventListener('pointermove', onSpotPointerMove, { passive: true });
        } else {
          document.removeEventListener('pointermove', onSpotPointerMove);
        }
      }
      function onSpotPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX;
        lastY = e.clientY;
        if (raf) return;
        raf = window.requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
        });
      }
      function setSpotPosition(x, y) {
        lastX = x;
        lastY = y;
        root.style.setProperty('--spot-x', lastX + 'px');
        root.style.setProperty('--spot-y', lastY + 'px');
      }

      window.addEventListener('message', function (e) {
        if (!e || !e.data || e.data.type !== 'city-spot-move') return;
        var x = e.data.x;
        var y = e.data.y;
        if (typeof x !== 'number' || typeof y !== 'number') return;
        if (!document.body.classList.contains('spot-on')) return;
        setSpotPosition(x, y);
      }, { passive: true });

      if (spotToggle) {
        spotToggle.addEventListener('click', function () {
          setSpotOn(!isSpotOn());
        });
      }
      if (isSpotOn()) {
        setSpotOn(true);
      }

      var musicToggle = document.getElementById('music-toggle');
      if (musicToggle) {
        function updateMusicButton() {
          var api = window.__CITY_AUDIO_API__;
          var on = api && api.getEnabled && api.getEnabled();
          musicToggle.classList.toggle('music-on', !!on);
          musicToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        musicToggle.addEventListener('click', function () {
          var api = window.__CITY_AUDIO_API__;
          if (!api || !api.setEnabled || !api.getEnabled) return;
          api.setEnabled(!api.getEnabled());
          updateMusicButton();
        });
        if (document.readyState === 'complete') {
          updateMusicButton();
        } else {
          document.addEventListener('DOMContentLoaded', updateMusicButton, { once: true });
        }
      }
    })();
  </script>
</body>
</html>
