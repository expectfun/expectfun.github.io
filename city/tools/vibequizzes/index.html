<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vibe quizzes</title>
  <style>
    :root {
      --bg: #070b10;
      --bg-soft: rgba(9, 14, 20, 0.82);
      --panel: rgba(9, 14, 20, 0.72);
      --neon: #7df0ff;
      --neon-dim: rgba(125, 240, 255, 0.35);
      --border: rgba(232, 238, 246, 0.18);
      --text: #e8eef6;
      --text-dim: rgba(232, 238, 246, 0.66);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1000px circle at 50% 0%, rgba(125, 240, 255, 0.10), transparent 60%),
        linear-gradient(180deg, #060b12 0%, #050910 100%);
      color: var(--text);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2.2rem 1.2rem 1.2rem;
    }
    .terminal-card {
      width: min(560px, 100%);
      padding: 1rem;
      border: 1px solid rgba(125, 240, 255, 0.2);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 0 24px rgba(125, 240, 255, 0.08);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text);
    }
    .tagline {
      margin: 0 0 1.2rem;
      font-size: 0.95rem;
      color: var(--text-dim);
      font-weight: 400;
    }
    .disclaimer {
      max-width: 360px;
      width: 100%;
      margin: 1.5rem 0 0;
      padding: 0.85rem 1.1rem;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--text-dim);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .quizzes {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: none;
      width: 100%;
    }
    .quizzes a {
      display: block;
      padding: 1rem 1.25rem;
      background: rgba(5, 9, 15, 0.82);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .quizzes a:hover {
      border-color: var(--neon);
      color: var(--neon);
      box-shadow: 0 0 12px var(--neon-dim);
    }
    .quizzes a:focus {
      outline: none;
      border-color: var(--neon);
      box-shadow: 0 0 0 2px var(--bg), 0 0 12px var(--neon-dim);
    }
  </style>
</head>
<body>
  <div class="terminal-card">
    <h1>vibe quizzes</h1>
    <p class="tagline">Geography quizzes on the map.</p>
    <nav class="quizzes">
      <a href="africa.html">Countries of Africa</a>
      <a href="asia.html">Countries of Asia</a>
      <a href="south-america.html">Countries of South America</a>
    </nav>
  </div>
</body>
</html>
