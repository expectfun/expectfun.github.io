  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent: #7df0ff;
      --accent2: #ffc56d;
      --accent-rgb: 125 240 255;
      --accent2-rgb: 255 197 109;

      --spot-x: 70%;
      --spot-y: 10%;
      --spot-alpha: 0.18;
      --hot: 0 255 106;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.30));
      pointer-events: none;
    }
    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit {
      display: inline-block;
    }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .overlay foreignObject { pointer-events: all; }
    .overlay > a.hotspot { pointer-events: all; cursor: pointer; }
    .overlay > a.hotspot rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
    }
    .overlay > a.hotspot:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .overlay > a.hotspot:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    .screen {
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      pointer-events: auto;
    }

    .screen-surface {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      background: rgb(0 0 0 / 0.78);
      border: 1px solid rgb(125 240 255 / 0.16);
      box-shadow: 0 0 0 2px rgb(0 0 0 / 0.25) inset;
      transform-origin: 56% 46%;
      transform:
        perspective(1100px)
        rotateX(-4.2deg)
        rotateY(9.5deg)
        rotateZ(1.6deg)
        skewY(0.8deg);
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .screen-surface--flat {
      transform: none;
      transform-origin: center;
    }

    .reader {
      height: 100%;
      overflow: auto;
      padding: 0.85rem 0.95rem;
      color: rgb(232 238 246 / 0.92);
      text-shadow: 0 0 14px rgb(125 240 255 / 0.08);
      font-size: 0.92rem;
      line-height: 1.55;
      transform: translateZ(1px);
    }
    .reader.is-terminal {
      padding: 0;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.82rem;
      line-height: 1.35;
      color: rgb(232 238 246 / 0.92);
      text-shadow: 0 0 12px rgb(125 240 255 / 0.08);
    }
    .reader.is-iframe {
      padding: 0;
      overflow: hidden;
    }
    .reader iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
    .reader h1 { font-size: 1.05rem; margin: 0 0 0.55rem; letter-spacing: -0.01em; }
    .reader h2 { font-size: 0.98rem; margin: 1.3rem 0 0.6rem; }
    .reader .date { color: rgb(232 238 246 / 0.66); font-size: 0.86rem; margin: 0 0 0.9rem; }
    .reader p { margin: 0 0 0.75rem; }
    .reader hr { border: 0; border-top: 1px solid rgb(125 240 255 / 0.16); margin: 1rem 0; }
    .reader img { max-width: 100%; height: auto; display: block; margin: 0.9rem 0; border-radius: 8px; }
    .reader a { color: rgb(var(--accent-rgb) / 0.92); text-decoration: none; border-bottom: 1px solid transparent; }
    .reader a:hover { border-bottom-color: rgb(var(--accent-rgb) / 0.65); }
    .reader a:focus-visible { outline: 2px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 3px; border-bottom-color: transparent; }
    .reader ul, .reader ol { margin: 0 0 0.85rem; padding-left: 1.4rem; }
    .reader li { margin-bottom: 0.35rem; }
    .reader blockquote {
      border-left: 1px solid rgb(var(--accent-rgb) / 0.40);
      margin: 0.9rem 0;
      padding-left: 0.9rem;
      color: rgb(232 238 246 / 0.74);
      font-style: italic;
    }
    .reader blockquote p { margin: 0 0 0.6rem; }
    .reader figcaption { color: rgb(232 238 246 / 0.66); font-size: 0.86rem; margin-top: 0.45rem; }

    .status {
      height: 100%;
      overflow: auto;
      padding: 0.55rem 0.7rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.82rem;
      line-height: 1.35;
      color: rgb(232 238 246 / 0.90);
      background: rgb(0 0 0 / 0.62);
      text-shadow: 0 0 12px rgb(125 240 255 / 0.08);
    }
    .status strong { color: rgb(var(--accent-rgb) / 0.92); }
    .status a { color: rgb(var(--accent-rgb) / 0.92); text-decoration: none; border-bottom: 1px solid transparent; }
    .status a:hover { border-bottom-color: rgb(var(--accent-rgb) / 0.65); }
    .status button {
      border: 1px solid var(--border);
      background: transparent;
      color: rgb(232 238 246 / 0.75);
      padding: 0.15rem 0.45rem;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .status button:hover {
      color: rgb(232 238 246 / 0.92);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .status button:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }
    .status .status-row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

    .terminal {
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      background: rgb(0 0 0 / 0.40);
    }
    .term-out {
      overflow: auto;
      padding: 0.75rem 0.85rem 0.6rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .term-line { margin: 0 0 0.2rem; }
    .term-line.dim { color: rgb(232 238 246 / 0.62); }
    .term-line.err { color: rgb(var(--accent2-rgb) / 0.92); }
    .term-form {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      padding: 0.55rem 0.85rem;
      border-top: 1px solid rgb(125 240 255 / 0.14);
      background: rgb(0 0 0 / 0.55);
    }
    .term-prompt { color: rgb(var(--accent-rgb) / 0.92); }
    .term-input {
      flex: 1;
      min-width: 10ch;
      border: 1px solid transparent;
      background: transparent;
      color: rgb(232 238 246 / 0.92);
      font: inherit;
      outline: none;
      padding: 0.1rem 0.2rem;
    }
    .term-input:focus-visible {
      border-color: rgb(var(--accent-rgb) / 0.35);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
      border-radius: 8px;
    }

  </style>
</head>

<h1>Jagged intelligence</h1>
      <p class="date"><i><time datetime="2026-01-07T21:10Z">07 Jan, 2026</time></i></p>

      <p><img src="../posts/images/ji3.jpg" alt="Well, you can probably guess how that image was created" />
Sure, everyone and their bear is writing about AI now, making you sick of reading about it. But they usually don't know how to do it right. I do. My blog is the right one to read. (Well, there's a <a href="https://en.wikipedia.org/wiki/Overconfidence_effect" target="_blank" rel="noopener">reason</a> it's called Overconfidence Effect.) So unfortunately for you, here goes yet another blog series on AI. Bear with me.</p>

      <p>Where to start? What's the most fundamental thing about AI that's not immediately obvious? I think the humanity is yet to fully grasp the concept of <strong>"jagged intelligence"</strong>.</p>

      <p>Once upon a time, back when no one was talking about AI (well, Ray Kurzweil was, but nobody else), I was watching a robot vacuum cleaner doing its thing. And looking at its attempts to cover all the floor surface, I couldn't help but feel two things at once:</p>
      <ul>
        <li>"Wow, how smart it is!"</li>
        <li>"Wow, how dumb it is!"</li>
      </ul>
      <p>It could move in pretty sophisticated ways, showing some kind of "understanding" of the environment... and right after that, it could get stuck in an "easily avoidable situation".</p>
      <p>And now, more than a decade later, I'm watching the progress of AI with similar feelings. LLMs are very "smart". LLMs are very "dumb". Those two things are not contradictory.</p>

      <hr>

      <h2 id="binary-fallacy">Binary fallacy</h2>
      <p>People tend to think in a binary way. Each thing is perceived as "good" or "bad", each innovation as "a revolution" or "a bubble". It's like we have just one bit of memory allocated to each of our verdicts. Well, that probably helped some cavemen escape tigers thousands of years ago and pass their genes to us. But I don't think that's a good way to reason about complicated things when we're not being chased by a tiger. And AI is complicated as hell.</p>
      <p>So when people talk about the "intelligence capabilities" of AI, they often see it either as a <em>genius invention that will soon surpass us at everything</em>, or as a <em>useless hallucinating machine that's confidently spitting out pointless probabilities</em>. It's seen as <em>"smart"</em> or <em>"dumb"</em>, one bit.</p>
      <p>In my opinion, both of these ways of thinking are flawed. What's the right one?</p>
      <p>In his 2025 year-end review, Andrej Karpathy <a href="https://karpathy.bearblog.dev/year-in-review-2025/" target="_blank" rel="noopener">wrote</a> about "jagged intelligence" and shared this image. I think that's the best visual representation of modern AI capabilities (shown in red, growing) compared to the human capabilities (shown in blue).</p>
      <p><img src="../posts/images/jagged-intelligence-diagram.webp" alt="a pic I shamelessly copied from Karpathy's post but he copied it too so it is okay" /></p>

      <hr>

      <h2 id="what-do-we-see-here">What do we see here?</h2>
      <ol>
        <li><strong>AI is "jagged"</strong>. It shines in some regards (let's call those parts of the image "jaggies"), but it lacks just as much in others. It helps the scientists to fold proteins, which has been seen as a miracle, but at the same time LLMs currently can't be trusted with counting letters in a word. So any one-bit evaluation like "it's smart" or "it's dumb" does not suffice. It's smart AND dumb, and sometimes it oscillates between those opposites during a single task, just like a robot vacuum cleaner.</li>
        <li><strong>Human intelligence, in fact, is jagged too</strong>. We are <em>tremendously good</em> at some tasks and <em>tremendously bad</em> at some others. We just don't see ourselves that way because we use ourselves as the unit of measure, just as our ancestors were sure "the world revolves around Earth". We intuitively feel that our capabilities are "balanced". (Spoiler: they're not.)</li>
        <li><strong>AI is not "more" or "less" capable than humans</strong>. It's a <em>different thing</em>. None of two stars in the image embeds the other fully, and they start from different places. So even though one is growing quickly, it doesn't guarantee it will cover the other. And saying "when AI will become smarter than us" may turn out like saying "when planes will become flyer than the birds". Planes can't and shouldn't "overcome" birds (have you ever seen a plane building a nest?).</li>
        <li><strong>AI overtakes humans in specific tasks</strong>. Even though planes can't "overtake the birds", they obviously overtook in some specific regards, like the speed of flight and the passenger-carrying ability. And those things matter to people, solving their needs. Same goes for AI. Some of their "jaggies", like translation ability, are useful for the tasks people were already doing.</li>
        <li><strong>AI capabilities are growing very fast</strong> (illustrated by the red star growing). Aviation slowly grew from a daring experiment into a reliable worldwide industry. AI grows much faster and gets into lots of industries at the same time. We've probably never witnessed a technology evolving at such speeds.</li>
        <li><strong>So it's getting impossible to ignore it</strong>. There was a lot of AI-mocking back when it drew extra fingers. Now the "jaggies" are getting so big and useful, it gets almost pointless to do some tasks without using them. And the list of such tasks is growing. It will get to some of <em>your</em> tasks, too.</li>
        <li><strong>But while it is growing, the "jaggedness" does not go away</strong>. So in some regards it still lacks a lot, compared both to the humans and to its own strong suits. It stumbles where a child would excel. It probably will grow rapidly but still stumble. It will become a "genius that can't lace a shoe".</li>
        <li><strong>And even if it becomes 100x more capable and overturns the economy, it might still get nowhere close to having human intelligence</strong>. There's no contradiction in that.</li>
      </ol>
      <p>Those things don't fit into the "binary thinking". But people still strive for a "one-bit answer". So the "jagged intelligence" leads to lots of flawed reasoning.</p>
      <p>Some people get very impressed by "jaggies": "Oh wow, it generated a logo for my business better than I ever could!" But while it's okay to be impressed, it gets easy to oversee the shortcomings. And that leads to people blindly trusting AI and then getting bitten by things like hallucinations.</p>
      <p>Other people see the shortcomings and say "since hallucinations are unavoidable, AI is useless". That prevents them from using the jaggies, which are becoming more and more indispensable.</p>

      <hr>

      <h2 id="whats-the-right-approach">What's the right approach?</h2>
      <p>Okay, there are lots of wrong approaches, but what's the right one?</p>
      <p>Stop thinking about AI in terms of a "monolithic thing" that's "smart" or "dumb" (it's both).</p>
      <p>Start thinking about AI — and yourself — in terms of "jaggies" and "shortcomings".</p>
      <p>What jaggies and shortcomings does AI currently have?</p>
      <p>What jaggies and shortcomings do <em>I</em> have?</p>
      <p>Where do our jaggies overlap and where do they complement each other?</p>
      <p>What can I gain by using the AI jaggies?</p>
      <p>How can I get bitten by them, such as "losing a job"?</p>
      <p>How can I get bitten by AI shortcomings, if I'm not careful?</p>
      <p>How can I get the most from AI and get bitten the least?</p>
      <p>Where are the AI jaggies likely to grow in the near future?</p>
      <p>How can those new ones help me, and how can they pose a threat to my way of living?</p>
      <p>How can it help humanity, and where does it pose a threat to humanity?</p>
      <p>I think all of those questions are more worth thinking about than the clickbaity binary-type ones like "AGI wen", which doesn't even have a clear definition. Leave such pointless questions to YouTubers desperate for clicks (and don't give them those clicks).</p>

      <hr>

      <h2 id="an-example">An example</h2>
      <p>I enjoy writing, and I think that's one of my "jaggies".</p>
      <p>Meanwhile, while LLMs produce a coherent text, AI writing mostly feels bland and superficial to me.</p>
      <p>So I don't let the AI do the writing for me. I'm quite overconfident my writing is better so far.</p>
      <p>But at the same time, English is not my native language, and LLMs are good with languages.</p>
      <p>So I wrote this post myself, but I asked Opus 4.5 afterwards to check it, and it found some mistakes and weird phrasing (while keeping all my silly bear puns). It even "understood" that the incorrent use of the word "flyer" was intentional!</p>
      <p>My "writing jaggie" was complemented by its "checking jaggie". Yes, I'm aware some mistakes could be left unnoticed. "Partial review" is still better than "no review".</p>
      <p>Another thing I found useful is to talk about a post I wrote with an LLM model. It's a bit like "<a href="https://en.wikipedia.org/wiki/Rubber_duck_debugging" target="_blank" rel="noopener">talking to a rubber duck</a>" where you have to find the right answers yourself, but the process helps. So one of AI "jaggies" is "being a rubber duck on steroids with a lossy copy of the internet built in".</p>
      <p>So I asked Opus if it agrees with this post and if it has something to add. Here's the most interesting part of its answer, after it was done with complimenting me:</p>
      <blockquote>
      <p>Where I'd add nuance:</p>
      <ul>
        <li>The shape of the jaggedness changes. Some gaps get filled (image models used to struggle with hands, now mostly don't). New gaps may appear as models are applied to new domains. So it's not static jaggedness - it's shifting jaggedness.</li>
        <li>Knowing one's own limitations is itself a limitation. I often don't know when I'm about to get something wrong. So "use the jaggies but avoid the shortcomings" is harder in practice than it sounds - sometimes the shortcoming surprises you.</li>
        <li>The post puts the burden of understanding on the user. That's reasonable, but AI developers also have responsibility to make limitations clearer and harder to stumble into.</li>
      </ul>
      </blockquote>
      <p>I think that the "shifting jaggedness" is really an interesting concept to think about, and the original Karpathy post didn't quite mention that, so it's a worthwhile addition. But as the author of this post, it's still <em>my</em> responsibility to evaluate its worthiness. It has to be <em>my</em> jaggie to check out where AI jaggies are giving me something worth including in the post.</p>

      <hr>

      <p>Okay, all of that might feel overwhelming... But we're just bearly getting started.</p>
      <p>With the speed of the jaggies growing, they will affect us so much there will be no option to NOT think about it in the future. The only thing in life we'll control is whether we adjust to get positive results instead of ruining everything. Success is our only motherfucking option — failure's not.</p>
      <p>So bear with me. See you in the next post.</p>
</article>`;

            '<hr>' +
            '<h2>Exit</h2>' +
            '<p>If you’re reading this, you already chose to open it. That’s the whole point: the interface is a world, and the world makes you choose.</p>' +
            '</article>',
        },
      ];

      function byId(id) {
        for (var i = 0; i < POSTS.length; i++) {
          if (POSTS[i].id === id) return POSTS[i];
        }
        return null;
      }

      function setStatus(text) {
        status.textContent = text;
      }

      function scrollToBottom(el) {
        try {
          el.scrollTop = el.scrollHeight;
        } catch (_) {}
      }

      function mountTerminal() {
        reader.classList.remove('is-iframe');
        reader.classList.add('is-terminal');
        reader.innerHTML =
          '<div class="terminal" role="application" aria-label="Library terminal">' +
          '  <div class="term-out" id="termOut" aria-live="polite"></div>' +
          '  <form class="term-form" id="termForm" autocomplete="off">' +
          '    <span class="term-prompt" aria-hidden="true">library&gt;</span>' +
          '    <input class="term-input" id="termInput" inputmode="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Terminal command" />' +
          '  </form>' +
          '</div>';

        var termOut = document.getElementById('termOut');
        var termForm = document.getElementById('termForm');
        var termInput = document.getElementById('termInput');

        function line(text, cls) {
          var div = document.createElement('div');
          div.className = 'term-line' + (cls ? ' ' + cls : '');
          div.textContent = text;
          termOut.appendChild(div);
          scrollToBottom(termOut);
        }

        function banner() {
          line('Library Terminal / local cache', 'dim');
          line('Type: help | ls | open <id|n> | clear', 'dim');
          line('');
          cmdLs();
          line('');
          setStatus('menu');
        }

        function cmdHelp() {
          line('help   - commands');
          line('ls     - list entries');
          line('open X - open entry by id or number');
          line('clear  - clear screen');
        }

        function cmdLs() {
          line('Entries:');
          for (var i = 0; i < POSTS.length; i++) {
            var p = POSTS[i];
            var tag = p.kind === 'external' ? 'external' : 'builtin';
            line('  ' + (i + 1) + ') ' + p.id + '  —  ' + p.title + '  [' + tag + ']');
          }
        }

        function resolveOpenArg(arg) {
          if (!arg) return null;
          if (/^\d+$/.test(arg)) {
            var n = parseInt(arg, 10);
            if (n >= 1 && n <= POSTS.length) return POSTS[n - 1];
          }
          return byId(arg);
        }

        function openEntry(entry) {
          if (!entry) {
            line('error: unknown entry. Try: ls', 'err');
            return;
          }
          line('opening: ' + entry.title + ' …', 'dim');
          if (entry.kind === 'builtin') {
            reader.classList.remove('is-terminal');
            reader.innerHTML = entry.html;
            setStatus(entry.title + ' (builtin)');
            return;
          }
          loadExternalPost(entry);
        }

        function runCommand(raw) {
          var input = (raw || '').trim();
          if (!input) return;
          line('library> ' + input, 'dim');

          var parts = input.split(/\s+/);
          var cmd = (parts[0] || '').toLowerCase();
          var arg = parts.slice(1).join(' ').trim();

          if (cmd === 'help' || cmd === '?') return cmdHelp();
          if (cmd === 'ls' || cmd === 'dir') return cmdLs();
          if (cmd === 'clear' || cmd === 'cls') {
            termOut.innerHTML = '';
            return;
          }
          if (cmd === 'open') return openEntry(resolveOpenArg(arg));
          line("error: unknown command. Try: help", 'err');
        }

        termForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var v = termInput.value;
          termInput.value = '';
          runCommand(v);
        });

        window.setTimeout(function () {
          try { termInput.focus(); } catch (_) {}
        }, 0);

        banner();
      }

      function loadExternalPost(entry) {
        var postPath = entry.path;
        var postUrl = new URL(postPath, window.location.href);

        if (window.location.protocol === 'file:') {
          reader.classList.remove('is-terminal');
          reader.classList.add('is-iframe');
          reader.innerHTML = '<iframe src="' + postPath + '" title="' + entry.title + '"></iframe>';
          setStatus(entry.title + ' (iframe)');
          return;
        }

        setStatus('loading…');
        fetch(postUrl.toString())
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(function (html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var article = doc.querySelector('article');
            if (!article) throw new Error('No <article> found');

            var clone = article.cloneNode(true);

            clone.querySelectorAll('script, style, link[rel="stylesheet"]').forEach(function (n) {
              if (n && n.parentNode) n.parentNode.removeChild(n);
            });

            clone.querySelectorAll('img[src]').forEach(function (img) {
              var src = img.getAttribute('src');
              if (!src) return;
              if (src.startsWith('data:') || src.startsWith('blob:')) return;
              img.setAttribute('src', new URL(src, postUrl).toString());
            });
            clone.querySelectorAll('a[href]').forEach(function (a) {
              var href = a.getAttribute('href');
              if (!href) return;
              if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
              var resolved = new URL(href, postUrl);
              a.setAttribute('href', resolved.toString());
              if (!isSafeSameOrigin(resolved)) {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener');
              }
            });

            reader.classList.remove('is-terminal');
            reader.classList.remove('is-iframe');
            reader.innerHTML = clone.innerHTML;
            setStatus(entry.title);
          })
          .catch(function (e) {
            var isHttps = window.location.protocol === 'https:';
            var hintEn = isHttps ? 'Load failed. Use “Open original”.' : 'Load failed. Open via http(s) and retry.';
            reader.classList.remove('is-terminal');
            reader.textContent = hintEn;
            setStatus('error');
            console.error(e);
          });
      }

      if (menuBtn) {
        menuBtn.addEventListener('click', function () {
          mountTerminal();
        });
      }

      mountTerminal();
    })();
  </script>
  <script src="gesture-bridge.js"></script>
</body>
</html>
