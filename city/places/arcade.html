<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent: #7df0ff;
      --accent2: #ffc56d;
      --accent-rgb: 125 240 255;
      --accent2-rgb: 255 197 109;

      --spot-x: 50%;
      --spot-y: 30%;
      --spot-alpha: 0.18;
      --hot: 0 255 106;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: right center;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.32));
      pointer-events: none;
    }

    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .crt {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: overlay;
      opacity: 0.95;
    }
    .crt .tear {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgb(255 255 255 / 0.06) 45%,
          rgb(var(--accent-rgb) / 0.10) 55%,
          transparent 100%);
      filter:
        blur(0.6px)
        drop-shadow(8px 0 rgb(var(--accent-rgb) / 0.20))
        drop-shadow(-8px 0 rgb(var(--accent2-rgb) / 0.16));
      animation: signal-tear 7.2s steps(1, end) infinite;
    }
    .crt .tear-full {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      animation: signal-tear-full 9s steps(1, end) infinite;
    }
    .crt .tear-full::before,
    .crt .tear-full::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgb(0 0 0 / 0.00) 0%,
          rgb(255 255 255 / 0.10) 35%,
          rgb(var(--accent-rgb) / 0.20) 50%,
          rgb(0 0 0 / 0.00) 100%);
      filter:
        blur(0.8px)
        drop-shadow(6px 0 rgb(var(--accent-rgb) / 0.25))
        drop-shadow(-6px 0 rgb(var(--accent2-rgb) / 0.20));
    }
    .crt .tear-full::before {
      clip-path: inset(0 0 50% 0);
    }
    .crt .tear-full::after {
      clip-path: inset(50% 0 0 0);
    }
    .crt::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          180deg,
          rgb(0 0 0 / 0.00) 0px,
          rgb(0 0 0 / 0.00) 2px,
          rgb(0 0 0 / 0.10) 3px
        );
      opacity: 0.55;
      animation: crt-roll 8.5s linear infinite;
    }
    .crt::after {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(closest-side at 50% 55%, transparent 60%, rgb(0 0 0 / 0.35) 100%),
        linear-gradient(90deg,
          rgb(var(--accent-rgb) / 0.06),
          transparent 35%,
          transparent 65%,
          rgb(var(--accent2-rgb) / 0.05)
        );
      mix-blend-mode: screen;
      filter:
        blur(0.7px)
        drop-shadow(2px 0 rgb(var(--accent-rgb) / 0.20))
        drop-shadow(-2px 0 rgb(var(--accent2-rgb) / 0.16));
      opacity: 0.62;
      transform: translate3d(0, 0, 0);
      animation:
        crt-flicker 6.6s steps(1, end) infinite,
        crt-jitter 8.5s ease-in-out infinite,
        crt-glitch 4.8s steps(1, end) infinite;
    }

    @keyframes crt-roll {
      0% { transform: translateY(-10%); }
      100% { transform: translateY(10%); }
    }
    @keyframes crt-flicker {
      0% { opacity: 0.50; }
      6% { opacity: 0.38; }
      7% { opacity: 0.55; }
      22% { opacity: 0.45; }
      23% { opacity: 0.58; }
      57% { opacity: 0.42; }
      58% { opacity: 0.60; }
      78% { opacity: 0.46; }
      79% { opacity: 0.56; }
      100% { opacity: 0.50; }
    }
    @keyframes crt-jitter {
      0%, 100% { transform: translate3d(0, 0, 0); }
      48% { transform: translate3d(-1px, 0, 0); }
      50% { transform: translate3d(1px, -1px, 0); }
      52% { transform: translate3d(0, 1px, 0); }
    }
    @keyframes crt-glitch {
      0%, 78%, 100% { clip-path: inset(0 0 0 0); transform: translate3d(0, 0, 0); }
      80% { clip-path: inset(12% 0 68% 0); transform: translate3d(-6px, 0, 0); }
      81% { clip-path: inset(44% 0 40% 0); transform: translate3d(7px, -1px, 0); }
      82% { clip-path: inset(0 0 0 0); transform: translate3d(0, 0, 0); }
      92% { clip-path: inset(60% 0 18% 0); transform: translate3d(5px, 0, 0); }
      93% { clip-path: inset(18% 0 62% 0); transform: translate3d(-5px, 1px, 0); }
      94% { clip-path: inset(0 0 0 0); transform: translate3d(0, 0, 0); }
    }
    @keyframes signal-tear {
      0%, 33%, 66%, 100% { opacity: 0; clip-path: inset(0 0 0 0); transform: translate3d(0, 0, 0); }

      36% { opacity: 0.75; clip-path: inset(48% 0 44% 0); transform: translate3d(-18px, 0, 0); }
      37% { opacity: 0.65; clip-path: inset(49% 0 43% 0); transform: translate3d(22px, 0, 0); }
      38% { opacity: 0.55; clip-path: inset(50% 0 42% 0); transform: translate3d(-10px, 0, 0); }
      39% { opacity: 0.0; clip-path: inset(0 0 0 0); transform: translate3d(0, 0, 0); }

      69% { opacity: 0.60; clip-path: inset(30% 0 62% 0); transform: translate3d(16px, 0, 0); }
      70% { opacity: 0.0; clip-path: inset(0 0 0 0); transform: translate3d(0, 0, 0); }
    }
    @keyframes signal-tear-full {
      0%, 38%, 100% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
      }
      40% {
        opacity: 0.75;
      }
      41% {
        opacity: 0.85;
        transform: translate3d(0, 0, 0);
      }
      42% {
        opacity: 0.85;
      }
      43% {
        opacity: 0.0;
        transform: translate3d(0, 0, 0);
      }
    }

    .hotspots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hotspots a { cursor: pointer; }
    .hotspots rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
    }
    .hotspots a:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .hotspots a:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit {
      display: inline-block;
    }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .bg { transform: none; }
      .crt { display: none; }
    }
  </style>
</head>
<body>
  <script>if (window.self !== window.top) document.body.classList.add('in-shell');</script>
  <main class="scene">
    <img class="bg" src="../pics/arcade-main.jpg" alt="Neon arcade room with Bruno's Roomba Ride cabinet and street exit.">
    <div class="vignette" aria-hidden="true"></div>
    <div class="spot" aria-hidden="true"></div>
    <div class="crt" aria-hidden="true">
      <div class="tear" aria-hidden="true"></div>
      <div class="tear-full" aria-hidden="true"></div>
    </div>

    <svg class="hotspots" viewBox="0 0 1287 832" preserveAspectRatio="xMaxYMid slice" aria-label="Arcade room hotspots">
      <a href="game.html" aria-label="Arcade machine (Bruno's Roomba Ride — Play)">
        <rect x="700" y="185" width="300" height="580" rx="14" ry="14"></rect>
      </a>
      <a href="street.html" aria-label="Exit to street">
        <rect x="1050" y="200" width="300" height="400" rx="0" ry="0"></rect>
      </a>
    </svg>

    <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = 'dark';

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var raf = 0;
      var lastX = 0;
      var lastY = 0;
      function onPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX;
        lastY = e.clientY;
        if (raf) return;
        raf = window.requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          root.style.setProperty('--spot-ready', '1');
        });
      }
      if (!reduceMotion) {
        root.style.setProperty('--spot-ready', '0');
        window.addEventListener('pointermove', onPointerMove, { passive: true });
      }
    })();
  </script>
  <script src="../js/gesture-bridge.js"></script>
</body>
</html>
