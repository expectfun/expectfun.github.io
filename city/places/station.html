<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Station</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent: #7df0ff;
      --accent2: #ffc56d;
      --accent-rgb: 125 240 255;
      --accent2-rgb: 255 197 109;

      --spot-x: 65%;
      --spot-y: 40%;
      --spot-alpha: 0.18;
      --hot: 0 255 106;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.32));
      pointer-events: none;
    }

    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .hotspots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hotspots a { cursor: pointer; }
    .hotspots rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
    }
    .hotspots a:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .hotspots a:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit {
      display: inline-block;
    }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

    .ticket-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .ticket-overlay.is-open {
      display: flex;
    }
    .ticket-overlay__inner {
      position: relative;
      width: 100%;
      max-width: 480px;
      padding: 1.5rem 1.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgb(var(--accent-rgb) / 0.08), 0 24px 48px rgba(0, 0, 0, 0.5);
      color: var(--text);
      font-size: 0.9375rem;
      line-height: 1.55;
    }
    .ticket-overlay__inner p { margin: 0 0 0.85rem; }
    .ticket-overlay__inner p:last-child { margin-bottom: 0; }
    .ticket-overlay__inner a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgb(var(--accent-rgb) / 0.4);
    }
    .ticket-overlay__inner a:hover { border-bottom-color: var(--accent); }
    .ticket-overlay__close {
      position: absolute;
      top: -2.5rem;
      right: 0;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.875rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .ticket-overlay__close:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.5);
    }

    @media (prefers-reduced-motion: reduce) {
      .bg { transform: none; }
    }
  </style>
</head>
<body>
  <script>if (window.self !== window.top) document.body.classList.add('in-shell');</script>
  <main class="scene">
    <img class="bg" src="../pics/station-hall.jpg" alt="Rainy cyberpunk station hall with departure boards and neon screens.">
    <div class="vignette" aria-hidden="true"></div>
    <div class="spot" aria-hidden="true"></div>

    <svg class="hotspots" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-label="City station hotspots">
      <a href="square.html" aria-label="Back to street">
        <rect x="0" y="250" width="300" height="430" rx="14" ry="14"></rect>
      </a>
      <a href="#" class="ticket-terminal" aria-label="Ticket terminal — departures">
        <rect x="680" y="380" width="250" height="280" rx="14" ry="14"></rect>
      </a>
      <a href="daemon.html" aria-label="Daemon (System)">
        <rect x="550" y="430" width="50" height="120" rx="14" ry="14"></rect>
      </a>
    </svg>

    <div class="ticket-overlay" id="ticket-overlay" aria-hidden="true">
      <div class="ticket-overlay__inner">
        <button type="button" class="ticket-overlay__close" id="ticket-overlay-close" aria-label="Close">Close</button>
        <p>Right now from this station you can only depart to the year 2000 — to <a href="http://city.cyberpunk.ru" target="_blank" rel="noopener noreferrer">http://city.cyberpunk.ru</a>, which was the inspiration for this city.</p>
        <p>If you’re building a similar city-site yourself, drop a line to <a href="mailto:eugene.triphonov@gmail.com">eugene.triphonov@gmail.com</a> — we might add it to the list of destinations.</p>
      </div>
    </div>

    <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = 'dark';

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var raf = 0;
      var lastX = 0;
      var lastY = 0;
      function onPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX;
        lastY = e.clientY;
        if (raf) return;
        raf = window.requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          root.style.setProperty('--spot-ready', '1');
        });
      }
      if (!reduceMotion) {
        root.style.setProperty('--spot-ready', '0');
        window.addEventListener('pointermove', onPointerMove, { passive: true });
      }
    })();

    (function () {
      var overlay = document.getElementById('ticket-overlay');
      var closeBtn = document.getElementById('ticket-overlay-close');
      var terminal = document.querySelector('a.ticket-terminal');
      if (!terminal || !overlay || !closeBtn) return;

      terminal.addEventListener('click', function (e) {
        e.preventDefault();
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
      });

      function closeOverlay() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
      }
      closeBtn.addEventListener('click', closeOverlay);
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeOverlay();
      });
    })();

    (function () {
      var msg = 'You are leaving the current city and will be taken to another site (city.cyberpunk.ru) which is not served over HTTPS. Proceed?';
      document.querySelectorAll('.ticket-overlay a[href="http://city.cyberpunk.ru"]').forEach(function (a) {
        a.addEventListener('click', function (e) {
          if (!window.confirm(msg)) e.preventDefault();
        });
      });
    })();
  </script>
  <script src="../js/gesture-bridge.js"></script>
</body>
</html>
