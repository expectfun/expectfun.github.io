<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Entry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent: #7df0ff;
      --accent2: #ffc56d;
      --accent-rgb: 125 240 255;
      --accent2-rgb: 255 197 109;

      --spot-x: 70%;
      --spot-y: 10%;
      --spot-alpha: 0.18;
      --hot: 0 255 106;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.32));
      pointer-events: none;
    }
    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .hotspots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hotspots a { cursor: pointer; }
    .hotspots rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
    }
    .hotspots a:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .hotspots a:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit {
      display: inline-block;
    }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

    .noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: screen;
      -webkit-mask-image: linear-gradient(to bottom, white 0%, white 25%, transparent 55%);
              mask-image: linear-gradient(to bottom, white 0%, white 25%, transparent 55%);
    }
    @media (prefers-reduced-motion: reduce) {
      .bg { transform: none; }
      .noise { display: none; }
    }
  </style>
</head>
<body>
  <script>if (window.self !== window.top) document.body.classList.add('in-shell');</script>
  <main class="scene">
    <img class="bg" src="../pics/city1port.jpg" alt="Neo-Kyoto port: District 7 waterfront, gateway, cranes and neon-lit city.">
    <div class="vignette" aria-hidden="true"></div>
    <canvas class="noise" aria-hidden="true"></canvas>
    <div class="spot" aria-hidden="true"></div>

    <svg class="hotspots" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-label="City entry hotspots">
      <a href="hub.html" aria-label="Entry">
        <rect x="650" y="250" width="570" height="300" rx="12" ry="12"></rect>
      </a>
    </svg>

    <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = 'dark';

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var raf = 0;
      var lastX = 0;
      var lastY = 0;
      function onPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX;
        lastY = e.clientY;
        if (raf) return;
        raf = window.requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          root.style.setProperty('--spot-ready', '1');
        });
      }
      if (!reduceMotion) {
        root.style.setProperty('--spot-ready', '0');
        window.addEventListener('pointermove', onPointerMove, { passive: true });
      }
    })();
  </script>
  <script>
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var canvas = document.querySelector('canvas.noise');
      if (!canvas) return;

      var scale = 2;
      var w, h, ctx, buf, data;

      function resize() {
        w = Math.ceil(canvas.clientWidth / scale);
        h = Math.ceil(canvas.clientHeight / scale);
        canvas.width = w;
        canvas.height = h;
        ctx = canvas.getContext('2d');
        buf = ctx.createImageData(w, h);
        data = buf.data;
      }
      resize();
      window.addEventListener('resize', resize);

      function frame() {
        for (var i = 0, len = data.length; i < len; i += 4) {
          var v = (Math.random() * 255) | 0;
          data[i] = v;
          data[i + 1] = v;
          data[i + 2] = v;
          data[i + 3] = 255;
        }
        ctx.putImageData(buf, 0, 0);
        setTimeout(frame, 80);
      }
      frame();
    })();
  </script>
  <script src="gesture-bridge.js"></script>
</body>
</html>
