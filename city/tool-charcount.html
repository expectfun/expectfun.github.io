<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Charcount Terminal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);
      --accent: #7df0ff;
      --accent-rgb: 125 240 255;
      --accent2: #ffc56d;
      --accent2-rgb: 255 197 109;
      --hot: 0 255 106;
      --cyan: #5de8d0;
      --purple: #c084ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Mono", "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, monospace;
      color: var(--cyan);
      background: var(--bg);
      overflow: hidden;
    }
    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.30));
      pointer-events: none;
    }
    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x, 50%) var(--spot-y, 50%),
          rgb(var(--accent-rgb) / 0.18),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .crt::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
      pointer-events: none;
      z-index: 10;
    }
    .crt::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 11;
    }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .terminal-screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 900px);
      height: min(85vh, 600px);
      background: rgba(6, 14, 20, 0.95);
      border: 1px solid rgba(93, 232, 208, 0.25);
      border-radius: 8px;
      box-shadow:
        0 0 40px rgba(93, 232, 208, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .terminal-header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid rgba(93, 232, 208, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }
    .terminal-header span {
      opacity: 0.7;
    }

    .terminal-header .close-btn {
      width: 1.4rem;
      height: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 0.75rem;
      color: var(--cyan);
      text-decoration: none;
      font-size: 1.1rem;
      line-height: 1;
      opacity: 0.6;
      border: 1px solid transparent;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .terminal-header .close-btn:hover {
      opacity: 1;
      background: rgba(255, 93, 93, 0.15);
      border-color: rgba(255, 93, 93, 0.4);
      color: var(--danger);
    }

    .terminal-body {
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow: hidden;
    }

    .input-area {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: rgba(93, 232, 208, 0.05);
      border: 1px solid rgba(93, 232, 208, 0.2);
      border-radius: 6px;
      padding: 1rem;
      color: var(--cyan);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus {
      border-color: rgba(93, 232, 208, 0.4);
      box-shadow: 0 0 15px rgba(93, 232, 208, 0.1);
    }
    textarea::placeholder {
      color: rgba(93, 232, 208, 0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .stat-card {
      background: rgba(93, 232, 208, 0.06);
      border: 1px solid rgba(93, 232, 208, 0.15);
      border-radius: 6px;
      padding: 0.75rem;
      text-align: center;
    }
    .stat-card.highlight {
      border-color: rgba(192, 132, 255, 0.4);
      background: rgba(192, 132, 255, 0.08);
    }
    .stat-card.highlight .stat-value {
      color: var(--purple);
      text-shadow: 0 0 8px rgba(192, 132, 255, 0.3);
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
      margin-bottom: 0.3rem;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--cyan);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 0.5rem 1rem;
      background: rgba(93, 232, 208, 0.08);
      border: 1px solid rgba(93, 232, 208, 0.25);
      border-radius: 4px;
      color: var(--cyan);
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(93, 232, 208, 0.15);
      border-color: rgba(93, 232, 208, 0.4);
    }
    .btn.primary {
      background: rgba(93, 232, 208, 0.12);
      border-color: rgba(93, 232, 208, 0.35);
    }
    .btn.primary:hover {
      background: rgba(93, 232, 208, 0.2);
      box-shadow: 0 0 15px rgba(93, 232, 208, 0.15);
    }
    .btn.ghost {
      background: transparent;
      border-color: rgba(93, 232, 208, 0.15);
      opacity: 0.7;
    }
    .btn.ghost:hover {
      opacity: 1;
      background: rgba(93, 232, 208, 0.05);
    }

    .selection-info {
      font-size: 0.7rem;
      opacity: 0.6;
      color: var(--cyan);
    }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit { display: inline-block; }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }

    .back-hotspot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .back-hotspot a {
      pointer-events: auto;
      cursor: pointer;
    }
    .back-hotspot rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
      transition: fill 0.15s;
    }
    .back-hotspot a:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .back-hotspot a:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    @media (prefers-reduced-motion: reduce) {
      .bg { transform: none; }
    }
  </style>
</head>
<body>
  <script>if (window.self !== window.top) document.body.classList.add('in-shell');</script>
  <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>

  <main class="scene">
    <svg class="back-hotspot" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-label="Back to workshop">
      <a href="workshop.html" aria-label="Back to Workshop">
        <rect x="0" y="0" width="1376" height="100" rx="0" ry="0"></rect>
      </a>
    </svg>
    <img class="bg" src="../pics/city16workshop.jpg" alt="Cyberpunk workshop with CRT monitors.">
    <div class="vignette" aria-hidden="true"></div>
    <div class="spot" aria-hidden="true"></div>

    <div class="overlay crt">
      <div class="terminal-screen">
        <div class="terminal-header">
          <span>CHARCOUNT_TERMINAL_v1.0</span>
          <div style="display: flex; align-items: center;">
            <span id="status">READY</span>
            <a href="workshop.html" class="close-btn" aria-label="Close terminal" title="Close">×</a>
          </div>
        </div>
        <div class="terminal-body">
          <div class="input-area">
            <textarea id="text-input" placeholder="Paste or type text here..."></textarea>
          </div>
          <div class="stats-grid">
            <div class="stat-card" id="card-chars">
              <div class="stat-label">Characters</div>
              <div class="stat-value" id="chars">0</div>
            </div>
            <div class="stat-card" id="card-no-spaces">
              <div class="stat-label">No spaces</div>
              <div class="stat-value" id="no-spaces">0</div>
            </div>
            <div class="stat-card" id="card-words">
              <div class="stat-label">Words</div>
              <div class="stat-value" id="words">0</div>
            </div>
            <div class="stat-card" id="card-lines">
              <div class="stat-label">Lines</div>
              <div class="stat-value" id="lines">0</div>
            </div>
            <div class="stat-card highlight" id="card-selected" style="display: none;">
              <div class="stat-label">Selected</div>
              <div class="stat-value" id="selected">0</div>
            </div>
          </div>
          <div class="controls">
            <div class="selection-info" id="selection-info"></div>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn ghost" id="btn-paste">Paste</button>
              <button class="btn ghost" id="btn-clear">Clear</button>
              <button class="btn primary" id="btn-copy">Copy all</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      const textInput = document.getElementById('text-input');
      const charsEl = document.getElementById('chars');
      const noSpacesEl = document.getElementById('no-spaces');
      const wordsEl = document.getElementById('words');
      const linesEl = document.getElementById('lines');
      const selectedCard = document.getElementById('card-selected');
      const selectedEl = document.getElementById('selected');
      const selectionInfo = document.getElementById('selection-info');
      const btnPaste = document.getElementById('btn-paste');
      const btnClear = document.getElementById('btn-clear');
      const btnCopy = document.getElementById('btn-copy');
      const status = document.getElementById('status');

      function updateStats() {
        const text = textInput.value;
        const chars = text.length;
        const noSpaces = text.replace(/\s/g, '').length;
        const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
        const lines = text.split('\n').length;

        charsEl.textContent = chars.toLocaleString();
        noSpacesEl.textContent = noSpaces.toLocaleString();
        wordsEl.textContent = words.toLocaleString();
        linesEl.textContent = lines.toLocaleString();

        const selected = getSelectedLength();
        if (selected > 0) {
          selectedCard.style.display = 'block';
          selectedEl.textContent = selected.toLocaleString();
          selectionInfo.textContent = `${selected} chars selected`;
        } else {
          selectedCard.style.display = 'none';
          selectionInfo.textContent = '';
        }

        status.textContent = chars > 0 ? 'ANALYZING' : 'READY';
      }

      function getSelectedLength() {
        const start = textInput.selectionStart;
        const end = textInput.selectionEnd;
        if (start !== end) {
          return textInput.value.substring(start, end).length;
        }
        return 0;
      }

      async function pasteText() {
        try {
          const text = await navigator.clipboard.readText();
          textInput.value = text;
          updateStats();
          status.textContent = 'PASTED';
          setTimeout(() => status.textContent = textInput.value.length > 0 ? 'ANALYZING' : 'READY', 1000);
        } catch (e) {
          status.textContent = 'ERROR';
          setTimeout(() => status.textContent = 'READY', 1500);
        }
      }

      function clearText() {
        textInput.value = '';
        updateStats();
        status.textContent = 'CLEARED';
        setTimeout(() => status.textContent = 'READY', 800);
      }

      async function copyAll() {
        try {
          await navigator.clipboard.writeText(textInput.value);
          btnCopy.textContent = 'Copied!';
          status.textContent = 'COPIED';
          setTimeout(() => {
            btnCopy.textContent = 'Copy all';
            status.textContent = textInput.value.length > 0 ? 'ANALYZING' : 'READY';
          }, 1200);
        } catch (e) {
          status.textContent = 'ERROR';
          setTimeout(() => status.textContent = 'READY', 1500);
        }
      }

      textInput.addEventListener('input', updateStats);
      textInput.addEventListener('select', updateStats);
      textInput.addEventListener('click', updateStats);
      textInput.addEventListener('keyup', updateStats);

      btnPaste.addEventListener('click', pasteText);
      btnClear.addEventListener('click', clearText);
      btnCopy.addEventListener('click', copyAll);

      // Spot effect
      const root = document.documentElement;
      let raf = 0, lastX = 0, lastY = 0;
      function onPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX; lastY = e.clientY;
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          root.style.setProperty('--spot-ready', '1');
        });
      }
      window.addEventListener('pointermove', onPointerMove, { passive: true });
    })();
  </script>
  <script src="gesture-bridge.js"></script>
</body>
</html>
