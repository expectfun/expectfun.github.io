<!DOCTYPE html>
<html lang="en" data-theme="dark" data-rain="off">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent: #7df0ff;
      --accent2: #ffc56d;
      --accent-rgb: 125 240 255;
      --accent2-rgb: 255 197 109;

      --spot-x: 70%;
      --spot-y: 10%;
      --spot-alpha: 0.18;
      --hot: 0 255 106;

      --rain-rgb: 214 238 255;
      --rain-alpha: 0.12;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.20), rgb(0 0 0 / 0.32));
      pointer-events: none;
    }
    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .rain {
      position: absolute;
      inset: -18%;
      pointer-events: none;
      opacity: 0.85;
      will-change: transform;
    }
    [data-rain="off"] .rain { display: none; }
    [data-theme="dark"] .rain { mix-blend-mode: screen; }

    .rain::before,
    .rain::after {
      content: "";
      position: absolute;
      inset: 0;
      background-repeat: repeat;
      transform: translate3d(0, 0, 0);
      animation-name: rain-fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: blur(0.25px);
    }
    .rain::before {
      background-image: repeating-linear-gradient(
        112deg,
        transparent 0 10px,
        rgb(var(--rain-rgb) / var(--rain-alpha)) 10px 12px
      );
      background-size: 340px 340px;
      animation-duration: 1.2s;
      opacity: 0.55;
    }
    .rain::after {
      background-image: repeating-linear-gradient(
        108deg,
        transparent 0 14px,
        rgb(var(--rain-rgb) / calc(var(--rain-alpha) * 0.72)) 14px 15px
      );
      background-size: 560px 560px;
      animation-duration: 1.85s;
      animation-delay: -0.6s;
      opacity: 0.35;
    }

    @keyframes rain-fall {
      from { transform: translate3d(-24px, -80px, 0); }
      to { transform: translate3d(36px, 220px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rain { display: none; }
    }

    .hotspots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hotspots a { cursor: pointer; }
    .hotspots rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
    }
    .hotspots a:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .hotspots a:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit {
      display: inline-block;
    }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

  </style>
</head>
<body>
  <script>if (window.self !== window.top) document.body.classList.add('in-shell');</script>
  <main class="scene">
    <img class="bg" src="../pics/city4hub.jpg" alt="Rainy neon street hub with signs pointing to different places.">
    <div class="vignette" aria-hidden="true"></div>
    <div class="spot" aria-hidden="true"></div>
    <div class="rain" aria-hidden="true"></div>

    <svg class="hotspots" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-label="City hub hotspots">
      <a href="arcade-room.html" aria-label="Arcade">
        <rect x="150" y="90" width="150" height="300" rx="14" ry="14"></rect>
      </a>
      <a href="library-room.html" aria-label="Library">
        <rect x="400" y="270" width="220" height="120" rx="14" ry="14"></rect>
      </a>
      <a href="daemon.html" aria-label="Daemon (System)">
        <rect x="580" y="300" width="220" height="170" rx="14" ry="14"></rect>
      </a>
      <a href="https://expectfun.github.io/defi-visualized/" aria-label="Rooftop (DeFi Visualized)" target="_blank" rel="noopener">
        <rect x="750" y="70" width="150" height="150" rx="14" ry="14"></rect>
      </a>
      <a href="street.html" aria-label="Forward (Street)">
        <rect x="560" y="420" width="260" height="260" rx="14" ry="14"></rect>
      </a>
      <a href="https://expectfun.github.io/vibetools/" aria-label="Workshop (vibe tools)" target="_blank" rel="noopener">
        <rect x="975" y="95" width="120" height="300" rx="14" ry="14"></rect>
      </a>
    </svg>

    <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = 'dark';

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var raf = 0;
      var lastX = 0;
      var lastY = 0;
      function onPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX;
        lastY = e.clientY;
        if (raf) return;
        raf = window.requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          root.style.setProperty('--spot-ready', '1');
        });
      }
      if (!reduceMotion) {
        root.style.setProperty('--spot-ready', '0');
        window.addEventListener('pointermove', onPointerMove, { passive: true });
      }
    })();
  </script>
  <script src="gesture-bridge.js"></script>
</body>
</html>
