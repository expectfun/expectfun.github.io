<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Book</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);
      --accent: #7df0ff;
      --accent-rgb: 125 240 255;
      --spot-x: 50%;
      --spot-y: 40%;
      --spot-alpha: 0.18;
      --hot: 0 255 106;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.30));
      pointer-events: none;
    }
    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .overlay > a.hotspot { pointer-events: all; cursor: pointer; }
    .overlay > a.hotspot rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
    }
    .overlay > a.hotspot:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .overlay > a.hotspot:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit {
      display: inline-block;
    }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

    .book-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .book-canvas.hidden { display: none; }

    .book-pages {
      position: absolute;
      inset: 0;
      pointer-events: none;
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    .book-pages.hidden { display: none; }
    .page-overlay {
      position: absolute;
      overflow: hidden;
      transform-style: preserve-3d;
      filter: grayscale(100%);
    }
    .page-overlay canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .page-overlay.left {
      transform-origin: right center;
      transform: skewY(-3deg);
    }
    .page-overlay.right {
      transform: none;
    }
    /** Landscape: left half — left edge lower than right (parallelogram), no vertical shortening */
    .page-overlay.full-left {
      transform-origin: right center;
      transform: skewY(-4deg);
    }
    .page-overlay.full-right {
      transform: none;
    }
    .page-overlay.left.hidden,
    .page-overlay.right.hidden,
    .page-overlay.full-left.hidden,
    .page-overlay.full-right.hidden {
      display: none;
    }
    .pager {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: auto;
      z-index: 1;
    }
    .pager button {
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .pager button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pager button:hover:not(:disabled) { border-color: rgb(var(--accent-rgb) / 0.5); }
    .pager .pager-load { margin-left: 0.5rem; font-size: 0.75rem; }
    .pager.hidden { display: none; }
  </style>
</head>
<body>
  <script>if (window.self !== window.top) document.body.classList.add('in-shell');</script>
  <main class="scene">
    <img class="bg" id="bgImg" src="../pics/city21book.jpg" alt="Open book with blank aged pages in a cyberpunk room.">
    <canvas class="book-canvas hidden" id="bookCanvas" aria-hidden="true"></canvas>
    <div class="book-pages hidden" id="bookPages">
      <div class="page-overlay left" id="pageLeft"><canvas id="canvasLeft"></canvas></div>
      <div class="page-overlay right" id="pageRight"><canvas id="canvasRight"></canvas></div>
      <div class="page-overlay full-left" id="pageFullLeft"><canvas id="canvasFullLeft"></canvas></div>
      <div class="page-overlay full-right" id="pageFullRight"><canvas id="canvasFullRight"></canvas></div>
    </div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="spot" aria-hidden="true"></div>

    <div class="pager hidden" id="pager" aria-label="Page navigation">
      <button type="button" id="btnPrev">Prev</button>
      <span id="pageInfo">1 / 1</span>
      <button type="button" id="btnNext">Next</button>
      <button type="button" id="btnLoadPdf" class="pager-load" aria-label="Load your own PDF">Load PDF</button>
    </div>
    <input type="file" id="pdfFileInput" accept="application/pdf" hidden aria-label="Choose PDF file">

    <svg class="overlay" viewBox="0 0 1408 768" preserveAspectRatio="xMidYMid slice" aria-label="Book location">
      <a href="library.html" class="hotspot" aria-label="Back to Library">
        <rect x="0" y="0" width="1408" height="120"></rect>
      </a>
    </svg>

    <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>
  </main>

  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = 'dark';

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var raf = 0;
      var lastX = 0;
      var lastY = 0;
      function onPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX;
        lastY = e.clientY;
        if (raf) return;
        raf = window.requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          root.style.setProperty('--spot-ready', '1');
        });
      }
      if (!reduceMotion) {
        root.style.setProperty('--spot-ready', '0');
        window.addEventListener('pointermove', onPointerMove, { passive: true });
      }

      var pdfjsLib = typeof window.pdfjsLib !== 'undefined' ? window.pdfjsLib : (window['pdfjs-dist/build/pdf'] || window['pdfjsLib']);
      if (pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      }

      var bgImg = document.getElementById('bgImg');
      var canvas = document.getElementById('bookCanvas');
      var ctx = canvas.getContext('2d');
      var bookPages = document.getElementById('bookPages');
      var pageLeft = document.getElementById('pageLeft');
      var pageRight = document.getElementById('pageRight');
      var pageFullLeft = document.getElementById('pageFullLeft');
      var pageFullRight = document.getElementById('pageFullRight');
      var canvasLeft = document.getElementById('canvasLeft');
      var canvasRight = document.getElementById('canvasRight');
      var canvasFullLeft = document.getElementById('canvasFullLeft');
      var canvasFullRight = document.getElementById('canvasFullRight');
      var ctxLeft = canvasLeft.getContext('2d');
      var ctxRight = canvasRight.getContext('2d');
      var ctxFullLeft = canvasFullLeft.getContext('2d');
      var ctxFullRight = canvasFullRight.getContext('2d');
      var pagerEl = document.getElementById('pager');
      var pageInfo = document.getElementById('pageInfo');
      var btnPrev = document.getElementById('btnPrev');
      var btnNext = document.getElementById('btnNext');
      var btnLoadPdf = document.getElementById('btnLoadPdf');
      var pdfFileInput = document.getElementById('pdfFileInput');

      var pdfDoc = null;
      var currentPage = 1;
      var numPages = 0;
      var isPortrait = true;
      var spreadStep = 1;

      function getCanvasSize() {
        var scene = document.querySelector('.scene');
        var w = scene.clientWidth;
        var h = scene.clientHeight;
        if (w <= 0 || h <= 0) { w = window.innerWidth; h = window.innerHeight; }
        return { w: w, h: h };
      }

      function pageRects(cw, ch) {
        var lx = 0.16 * cw;
        var rx = 0.50 * cw;
        var mid = 0.34 * cw;
        var wy = 0.12 * ch;
        var h = 0.76 * ch;
        return {
          left: { x: lx, y: wy, w: mid, h: h },
          right: { x: rx, y: wy, w: mid, h: h },
          full: { x: lx, y: wy, w: (rx - lx) + mid, h: h }
        };
      }

      function drawBg() {
        var s = getCanvasSize();
        canvas.width = s.w;
        canvas.height = s.h;
        if (!bgImg.complete || !bgImg.naturalWidth) return;
        var iw = bgImg.naturalWidth;
        var ih = bgImg.naturalHeight;
        var r = Math.max(s.w / iw, s.h / ih);
        var dw = iw * r;
        var dh = ih * r;
        var dx = (s.w - dw) / 2;
        var dy = (s.h - dh) / 2;
        ctx.drawImage(bgImg, 0, 0, iw, ih, dx, dy, dw, dh);
      }

      function makeWhiteTransparent(ctx, width, height) {
        var data = ctx.getImageData(0, 0, width, height);
        var d = data.data;
        for (var i = 0; i < d.length; i += 4) {
          if (d[i] > 250 && d[i + 1] > 250 && d[i + 2] > 250) d[i + 3] = 0;
        }
        ctx.putImageData(data, 0, 0);
      }

      function renderOnePageToCtx(pageNum, rect, targetCtx, targetCanvas) {
        var cw = Math.max(1, Math.round(rect.w));
        var ch = Math.max(1, Math.round(rect.h));
        targetCanvas.width = cw;
        targetCanvas.height = ch;
        targetCtx.clearRect(0, 0, cw, ch);
        return pdfDoc.getPage(pageNum).then(function (p) {
          var vp = p.getViewport({ scale: 1.5 });
          var s = Math.min(rect.w / vp.width, rect.h / vp.height);
          var dx = (rect.w - vp.width * s) / 2;
          var dy = (rect.h - vp.height * s) / 2;
          return p.render({
            canvasContext: targetCtx,
            viewport: vp,
            transform: [s, 0, 0, s, dx, dy]
          }).promise;
        }).then(function () {
          makeWhiteTransparent(targetCtx, cw, ch);
        });
      }

      function renderOnePage(pageNum, rect) {
        return pdfDoc.getPage(pageNum).then(function (p) {
          var vp = p.getViewport({ scale: 1.5 });
          var s = Math.min(rect.w / vp.width, rect.h / vp.height);
          var dx = rect.x + (rect.w - vp.width * s) / 2;
          var dy = rect.y + (rect.h - vp.height * s) / 2;
          return p.render({
            canvasContext: ctx,
            viewport: vp,
            transform: [s, 0, 0, s, dx, dy]
          }).promise;
        });
      }

      /** Gap along the spine (book fold) as fraction of spread width; leaves background visible between halves */
      var SPINE_GAP_FRAC = 0.01;

      function renderSpreadToHalfOverlays(pageNum, rect) {
        var fullW = Math.round(rect.w);
        var halfW = Math.max(1, Math.floor(fullW / 2));
        var ch = Math.max(1, Math.round(rect.h));
        var spineGapPx = Math.max(2, Math.round(rect.w * SPINE_GAP_FRAC));
        var halfVisible = Math.max(1, halfW - Math.floor(spineGapPx / 2));

        var offscreen = document.createElement('canvas');
        offscreen.width = fullW;
        offscreen.height = ch;
        var offCtx = offscreen.getContext('2d');
        return pdfDoc.getPage(pageNum).then(function (p) {
          var vp = p.getViewport({ scale: 1.5 });
          var s = Math.min(rect.w / vp.width, rect.h / vp.height);
          var dx = (rect.w - vp.width * s) / 2;
          var dy = (rect.h - vp.height * s) / 2;
          return p.render({
            canvasContext: offCtx,
            viewport: vp,
            transform: [s, 0, 0, s, dx, dy]
          }).promise;
        }).then(function () {
          makeWhiteTransparent(offCtx, fullW, ch);
          canvasFullLeft.width = halfVisible;
          canvasFullLeft.height = ch;
          ctxFullLeft.clearRect(0, 0, halfVisible, ch);
          ctxFullLeft.drawImage(offscreen, 0, 0, halfVisible, ch, 0, 0, halfVisible, ch);

          canvasFullRight.width = halfVisible;
          canvasFullRight.height = ch;
          ctxFullRight.clearRect(0, 0, halfVisible, ch);
          ctxFullRight.drawImage(offscreen, fullW - halfVisible, 0, halfVisible, ch, 0, 0, halfVisible, ch);
        });
      }

      function render() {
        if (!pdfDoc || !bgImg.complete) return;
        var s = getCanvasSize();
        if (s.w <= 0 || s.h <= 0) return;
        canvas.classList.remove('hidden');
        drawBg();
        var rects = pageRects(s.w, s.h);

        if (isPortrait && currentPage + 1 <= numPages) {
          bookPages.classList.remove('hidden');
          pageFullLeft.classList.add('hidden');
          pageFullRight.classList.add('hidden');
          pageLeft.classList.remove('hidden');
          pageRight.classList.remove('hidden');
          pageLeft.style.left = rects.left.x + 'px';
          pageLeft.style.top = rects.left.y + 'px';
          pageLeft.style.width = rects.left.w + 'px';
          pageLeft.style.height = rects.left.h + 'px';
          pageRight.style.left = rects.right.x + 'px';
          pageRight.style.top = rects.right.y + 'px';
          pageRight.style.width = rects.right.w + 'px';
          pageRight.style.height = rects.right.h + 'px';

          ctx.globalCompositeOperation = 'source-over';
          Promise.all([
            renderOnePageToCtx(currentPage, rects.left, ctxLeft, canvasLeft),
            renderOnePageToCtx(currentPage + 1, rects.right, ctxRight, canvasRight)
          ]).catch(function (err) { console.error(err); });
        } else {
          bookPages.classList.remove('hidden');
          pageLeft.classList.add('hidden');
          pageRight.classList.add('hidden');
          pageFullLeft.classList.remove('hidden');
          pageFullRight.classList.remove('hidden');
          var spineGap = Math.max(2, rects.full.w * SPINE_GAP_FRAC);
          var halfW = rects.full.w / 2 - spineGap / 2;
          pageFullLeft.style.left = rects.full.x + 'px';
          pageFullLeft.style.top = rects.full.y + 'px';
          pageFullLeft.style.width = halfW + 'px';
          pageFullLeft.style.height = rects.full.h + 'px';
          pageFullRight.style.left = (rects.full.x + rects.full.w / 2 + spineGap / 2) + 'px';
          pageFullRight.style.top = rects.full.y + 'px';
          pageFullRight.style.width = halfW + 'px';
          pageFullRight.style.height = rects.full.h + 'px';

          ctx.globalCompositeOperation = 'source-over';
          renderSpreadToHalfOverlays(currentPage, rects.full).catch(function (err) { console.error(err); });
        }

        var rightPage = isPortrait && currentPage + 1 <= numPages ? currentPage + 1 : currentPage;
        pageInfo.textContent = currentPage + (rightPage > currentPage ? '–' + rightPage : '') + ' / ' + numPages;
        btnPrev.disabled = currentPage <= 1;
        btnNext.disabled = (isPortrait ? currentPage + 2 > numPages : currentPage >= numPages);
        pagerEl.classList.remove('hidden');
      }

      function loadPdf(source) {
        if (!pdfjsLib || !pdfjsLib.getDocument) return;
        var opts = typeof source === 'string' ? { url: source } : { data: source };
        pdfjsLib.getDocument(opts).promise.then(function (doc) {
          pdfDoc = doc;
          numPages = doc.numPages;
          currentPage = 1;
          doc.getPage(1).then(function (p) {
            var v = p.getViewport({ scale: 1 });
            isPortrait = v.width < v.height;
            spreadStep = isPortrait ? 2 : 1;
            render();
          });
        }).catch(function (err) {
          console.error('PDF load error:', err);
        });
      }

      function initPdf() {
        var url = new URL('forster.pdf', window.location.href).href;
        fetch(url).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.arrayBuffer();
        }).then(loadPdf).catch(function () {
          loadPdf(url);
        });
      }

      btnPrev.addEventListener('click', function () {
        if (currentPage <= 1) return;
        currentPage = Math.max(1, currentPage - spreadStep);
        render();
      });
      btnNext.addEventListener('click', function () {
        if (isPortrait && currentPage + 2 > numPages) return;
        if (!isPortrait && currentPage >= numPages) return;
        currentPage = Math.min(numPages, currentPage + spreadStep);
        render();
      });
      btnLoadPdf.addEventListener('click', function () { pdfFileInput.click(); });
      pdfFileInput.addEventListener('change', function () {
        var file = pdfFileInput.files && pdfFileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () { loadPdf(reader.result); };
        reader.readAsArrayBuffer(file);
        pdfFileInput.value = '';
      });

      bgImg.addEventListener('load', drawBg);
      if (bgImg.complete) drawBg();
      window.addEventListener('resize', function () {
        if (pdfDoc) render();
        else drawBg();
      });

      if (pdfjsLib && pdfjsLib.getDocument) initPdf();
    })();
  </script>
  <script src="gesture-bridge.js"></script>
</body>
</html>
